[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "pipecat-external-voice-transport"
version = "0.1.4"
description = "External Transport Protocol v1 server for Voice Satellite"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
realtime = [
  "pipecat-ai[openai]>=1.8.1,<1.9",
]
tools = [
  "httpx2>=2.12,<3",
  "mcp>=2.1,<3",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_transport"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 10
timeout_method = "thread"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
