services:
  pipecat-external-voice-transport:
    image: ghcr.io/brennand97/pipecat-external-voice-transport:${IMAGE_TAG:?Set IMAGE_TAG to an immutable v* or sha-* release tag}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s
